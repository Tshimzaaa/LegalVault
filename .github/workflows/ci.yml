name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legalvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Owner role (postgres superuser in the service container) — used for
      # migrations, which need to ALTER TABLE / CREATE POLICY.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legalvault_test
      # A Postgres superuser always bypasses row-level security, same as
      # Neon's default owner role does in real environments (see
      # backend/docs/architecture.md) — so tests need a separate, restricted
      # role for RLS to mean anything here. Created by the step below.
      RUNTIME_DATABASE_URL: postgresql://app_runtime:app_runtime_ci_password@localhost:5432/legalvault_test
      SECRET_KEY: ci-only-secret-not-for-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      OWNER_SECRET: ci-owner-secret
      ENVIRONMENT: development
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_ENDPOINT_URL: https://example.invalid
      R2_BUCKET_NAME: ci-placeholder
      CLAMD_HOST: localhost
      CLAMD_PORT: "3310"
      # Required (no default in Settings) — must be a real Fernet key or the app fails to
      # import at all. CI-only, never a production secret; only ever encrypts
      # integration-credential rows this run creates and discards.
      ENCRYPTION_KEY: DalpMyi31rySfDxzuxq0nmzwG-VDxpQz7THePu1u8lc=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head

      - name: Create restricted app_runtime role (RLS only applies to non-BYPASSRLS roles)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d legalvault_test <<'SQL'
          CREATE ROLE app_runtime WITH LOGIN PASSWORD 'app_runtime_ci_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE legalvault_test TO app_runtime;
          GRANT USAGE ON SCHEMA public TO app_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_runtime;
          SQL

      - run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx oxlint

      - run: npm test

      - run: npm run build

  # Only fires on a push to main, and only once both jobs above are green — Render's own
  # deploy-on-push doesn't know or care whether tests passed, so autoDeploy is off for
  # every service in render.yaml and deploys are triggered here instead, via each
  # service's deploy-hook URL (Settings tab in the Render dashboard, pasted into these
  # three repo secrets once the Blueprint exists — see DEPLOYMENT.md).
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API
        run: curl -fsS "${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}"
      - name: Deploy worker
        run: curl -fsS "${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}"
      - name: Deploy frontend
        run: curl -fsS "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"
