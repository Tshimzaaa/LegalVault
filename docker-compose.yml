services:
  # Primary application database (replaces Neon for this pivot — see backend/.env). The
  # app_runtime role below is created on first boot via docker/postgres-init/ so it exists
  # before Alembic ever runs; ALTER DEFAULT PRIVILEGES means every table the migrations
  # (run as the `legalvault` owner role) create is automatically readable/writable by
  # app_runtime too, without a manual GRANT step after each migration (unlike the CI
  # workflow's one-off GRANT ALL TABLES, which only covers tables that already exist).
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legalvault
      POSTGRES_PASSWORD: legalvault
      POSTGRES_DB: legalvault
    ports:
      # Host port 5433, not 5432 — this machine already has a native Postgres service
      # bound to 5432 (see `Get-Service *postgres*`), which silently intercepted
      # connections meant for this container during setup.
      - "5433:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery broker for background jobs (matter due-date / contract expiry reminders — see
  # backend/app/tasks/). No persistence needed — job state lives in Postgres (via
  # Notification rows); Redis here is purely a task queue.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s # first-boot virus database download is slow

  # Self-hosted e-signature backend (see app/core/documenso_client.py). One instance
  # serves every firm on the platform — firms never see or run this themselves. After
  # first boot, create an API token in the Documenso UI (http://localhost:3000 ->
  # Settings -> API Tokens) and put it in backend/.env as DOCUMENSO_API_KEY, then
  # configure a webhook (Settings -> Webhooks) pointing at
  # http://<backend-host>:8000/webhooks/documenso with the same secret as
  # DOCUMENSO_WEBHOOK_SECRET. NEXTAUTH_SECRET/NEXT_PRIVATE_ENCRYPTION_KEY below are
  # throwaway dev values — generate real ones (e.g. `openssl rand -hex 32`) for any
  # shared or production environment.
  documenso-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: documenso
      POSTGRES_DB: documenso
    volumes:
      - documenso-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso"]
      interval: 10s
      timeout: 5s
      retries: 5

  documenso:
    image: documenso/documenso:latest
    ports:
      - "3000:3000"
    depends_on:
      documenso-db:
        condition: service_healthy
    environment:
      PORT: "3000"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_WEBAPP_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "dev-only-nextauth-secret-change-me"
      NEXT_PRIVATE_ENCRYPTION_KEY: "dev-only-encryption-key-change-me"
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: "dev-only-secondary-key-change-me"
      NEXT_PRIVATE_DATABASE_URL: "postgres://documenso:documenso@documenso-db:5432/documenso"
      NEXT_PRIVATE_DIRECT_DATABASE_URL: "postgres://documenso:documenso@documenso-db:5432/documenso"
      # Local dev has no real mail server — points at itself so signing invites don't
      # crash the app; emails silently fail to send. Point this at a real SMTP relay
      # (or a local catcher like Mailhog) to actually receive signing-invite emails.
      NEXT_PRIVATE_SMTP_TRANSPORT: "smtp-auth"
      NEXT_PRIVATE_SMTP_HOST: "localhost"
      NEXT_PRIVATE_SMTP_PORT: "2500"
      # Documenso's own document-creation flow (the one app/core/documenso_client.py
      # calls) refuses to run without S3-compatible object storage configured — it
      # has no local/database-storage fallback for that specific path. Reuses the
      # same Cloudflare R2 bucket/credentials the main app already has (see
      # backend/.env's R2_* vars) via the root .env file docker compose loads
      # automatically; regenerate that root .env from backend/.env if the R2
      # credentials ever rotate.
      NEXT_PUBLIC_UPLOAD_TRANSPORT: "s3"
      NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID: "${NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID}"
      NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY: "${NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY}"
      NEXT_PRIVATE_UPLOAD_ENDPOINT: "${NEXT_PRIVATE_UPLOAD_ENDPOINT}"
      NEXT_PRIVATE_UPLOAD_BUCKET: "${NEXT_PRIVATE_UPLOAD_BUCKET}"
      NEXT_PRIVATE_UPLOAD_REGION: "auto"
      NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE: "false"

volumes:
  app-db-data:
  clamav-data:
  documenso-db-data:
