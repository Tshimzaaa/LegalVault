# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the backend API + Celery worker + Redis + the static frontend build as four
# services. autoDeploy is off everywhere: deploys are triggered by .github/workflows/ci.yml's
# `deploy` job (via each service's deploy-hook URL), only after tests/lint/build pass on
# main — not on every push the way Render's own deploy-on-push would.
#
# Not validated against a live Render account (no credentials available to create one) —
# the first Blueprint sync in the Render dashboard is the real syntax check. See
# DEPLOYMENT.md for the setup steps (connecting the repo, filling in `sync: false` vars,
# copying the three deploy-hook URLs into GitHub repo secrets).

envVarGroups:
  - name: legalvault-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: SECRET_KEY
        generateValue: true
      - key: REGISTER_SECRET
        generateValue: true
      - key: OWNER_SECRET
        generateValue: true
      # Must be a real Fernet key (python -c "from cryptography.fernet import Fernet;
      # print(Fernet.generate_key().decode())") — generateValue's random string isn't
      # guaranteed to be valid Fernet-format, so this stays a manual paste.
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RUNTIME_DATABASE_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: DOCUMENSO_API_URL
        sync: false
      - key: DOCUMENSO_API_KEY
        sync: false
      - key: DOCUMENSO_WEBHOOK_SECRET
        sync: false
      # Optional — leave blank in the dashboard to skip Sentry entirely.
      - key: SENTRY_DSN
        sync: false

services:
  - name: legalvault-redis
    type: keyvalue
    plan: starter
    ipAllowList: []

  # Malware scanner for every upload. Without it uploads are refused (fail closed, HTTP 503),
  # so documents, templates, signed contracts and intake attachments do not work. clamd loads
  # the whole signature database into memory (roughly 1.5 GB), so it needs the standard plan;
  # the disk keeps the downloaded definitions across restarts so a restart is not followed by
  # a long window of refused uploads while freshclam downloads them again.
  - name: legalvault-clamav
    type: pserv
    runtime: image
    image:
      url: docker.io/clamav/clamav:stable
    plan: standard
    autoDeploy: false
    disk:
      name: clamav-db
      mountPath: /var/lib/clamav
      sizeGB: 2

  - name: legalvault-api
    type: web
    runtime: python
    plan: starter
    rootDir: backend
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVarGroups:
      - legalvault-shared
    envVars:
      - key: REDIS_URL
        fromService:
          name: legalvault-redis
          type: keyvalue
          property: connectionString
      - key: CLAMD_HOST
        fromService:
          name: legalvault-clamav
          type: pserv
          property: host
      - key: CLAMD_PORT
        value: "3310"
      # Render service URLs are https://<name>.onrender.com by default — update this if
      # legalvault-frontend later gets a custom domain.
      - key: FRONTEND_URL
        value: https://legalvault-frontend.onrender.com

  - name: legalvault-worker
    type: worker
    runtime: python
    plan: starter
    rootDir: backend
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks.celery_app worker --beat --loglevel=info
    envVarGroups:
      - legalvault-shared
    envVars:
      - key: REDIS_URL
        fromService:
          name: legalvault-redis
          type: keyvalue
          property: connectionString

  - name: legalvault-frontend
    type: web
    runtime: static
    rootDir: frontend
    autoDeploy: false
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Without this, a hard refresh (or a shared link) on any client-side route deeper than
    # `/` — /staff/dashboard, /about, a 404, etc. — 404s at Render's host level before
    # React Router ever gets a chance to run. This falls back to index.html for anything
    # that isn't a real static asset, letting the SPA's own routing (including its real
    # 404 page) handle it instead.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Same default-URL note as FRONTEND_URL above.
      - key: VITE_API_BASE_URL
        value: https://legalvault-api.onrender.com
      - key: VITE_SENTRY_DSN
        sync: false
